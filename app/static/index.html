<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Face Recognition (FastAPI)</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>Face Recognition</h1>
        <p class="sub">Detección + registro + entrenamiento incremental (JSON)</p>
      </div>
    </header>

    <main class="layout">
      <section class="video">
        <article class="streamCard">
          <div class="streamLabel">Vista procesada (cliente)</div>
          <div class="canvasWrap">
            <video id="cameraPreview" autoplay playsinline muted style="display: none;"></video>
            <canvas id="viewCanvas"></canvas>
          </div>
          <div class="metrics" aria-label="métricas">
            <div>FPS: <b id="fps">0</b></div>
            <div>Inferencia: <b id="inferenceMs">0</b> ms</div>
            <div>Caras: <b id="facesCount">0</b></div>
          </div>
        </article>
      </section>

      <section class="panel">
        <h2>Estado</h2>
        <div class="kv">
          <div class="kvRow"><span>Modelo</span><b id="modelStatus">-</b></div>
          <div class="kvRow"><span>Embeddings</span><b id="embeddingsStatus">-</b></div>
        </div>
        <div class="actions">
          <button id="refreshStatusBtn" type="button">Refrescar</button>
          <button id="reloadModelBtn" type="button">Recargar modelo</button>
        </div>
        <p id="globalStatus" class="status" role="status"></p>

        <h2>Parámetros</h2>
        <form id="paramsForm" autocomplete="off">
          <label class="field">
            <span class="label">Detector</span>
            <select id="face_detector" name="face_detector">
              <option value="haar">haar</option>
              <option value="mtcnn">mtcnn</option>
            </select>
          </label>

          <div class="grid2">
            <label class="field">
              <span class="label">Procesar cada N frames</span>
              <input id="process_every_n_frames" name="process_every_n_frames" type="number" min="1" step="1" />
            </label>

            <label class="field">
              <span class="label">Max caras</span>
              <input id="max_faces" name="max_faces" type="number" min="0" step="1" />
            </label>
          </div>

          <fieldset class="fieldset">
            <legend>Apariencia (canvas)</legend>

            <div class="grid2">
              <label class="field">
                <span class="label">Color</span>
                <input id="draw_color" name="draw_color" type="color" value="#00FF00" />
              </label>

              <label class="field">
                <span class="label">Grosor (1-10)</span>
                <input id="draw_thickness" name="draw_thickness" type="number" min="1" max="10" step="1" value="2" />
              </label>
            </div>
          </fieldset>

          <div class="actions">
            <button type="submit">Aplicar</button>
            <button id="reloadParamsBtn" type="button">Recargar</button>
          </div>

          <p id="paramsStatus" class="status" role="status"></p>
        </form>

        <h2>Registro</h2>
        <label class="field">
          <span class="label">Nombre de la persona</span>
          <input id="registerName" type="text" placeholder="Ej: Ulises" />
        </label>
        <div class="grid2">
          <button id="captureBtn" type="button">Capturar foto</button>
          <button id="clearCapturesBtn" type="button">Limpiar</button>
        </div>
        <div class="actions">
          <button id="sendRegisterBtn" type="button">Enviar registro</button>
          <button id="trainBtn" type="button">Entrenar / actualizar</button>
        </div>
        <p id="registerStatus" class="status" role="status"></p>

        <h2>Usuarios</h2>
        <div class="actions">
          <button id="refreshUsersBtn" type="button">Actualizar lista</button>
        </div>
        <ul id="usersList" class="list" aria-label="usuarios"></ul>
      </section>
    </main>

    <script>
      const els = {
        cameraPreview: document.getElementById('cameraPreview'),
        viewCanvas: document.getElementById('viewCanvas'),
        fps: document.getElementById('fps'),
        inferenceMs: document.getElementById('inferenceMs'),
        facesCount: document.getElementById('facesCount'),

        modelStatus: document.getElementById('modelStatus'),
        embeddingsStatus: document.getElementById('embeddingsStatus'),
        globalStatus: document.getElementById('globalStatus'),
        refreshStatusBtn: document.getElementById('refreshStatusBtn'),
        reloadModelBtn: document.getElementById('reloadModelBtn'),

        paramsForm: document.getElementById('paramsForm'),
        reloadParamsBtn: document.getElementById('reloadParamsBtn'),
        paramsStatus: document.getElementById('paramsStatus'),
        face_detector: document.getElementById('face_detector'),
        process_every_n_frames: document.getElementById('process_every_n_frames'),
        max_faces: document.getElementById('max_faces'),
        draw_color: document.getElementById('draw_color'),
        draw_thickness: document.getElementById('draw_thickness'),

        registerName: document.getElementById('registerName'),
        captureBtn: document.getElementById('captureBtn'),
        clearCapturesBtn: document.getElementById('clearCapturesBtn'),
        sendRegisterBtn: document.getElementById('sendRegisterBtn'),
        trainBtn: document.getElementById('trainBtn'),
        registerStatus: document.getElementById('registerStatus'),

        refreshUsersBtn: document.getElementById('refreshUsersBtn'),
        usersList: document.getElementById('usersList'),
      };

      const viewCtx = els.viewCanvas.getContext('2d', { willReadFrequently: false });
      const captureCanvas = document.createElement('canvas');
      const captureCtx = captureCanvas.getContext('2d', { willReadFrequently: false });

      const state = {
        cameraStream: null,
        captureTimer: null,
        renderHandle: 0,
        sendingFrame: false,
        lastFaces: [],
        lastInferenceMs: 0,
        fpsCounter: 0,
        fpsLastTs: performance.now(),
        fpsValue: 0,
        captures: [],
        drawColor: '#00FF00',
        drawThickness: 2,
      };

      function setStatus(el, msg, isError = false) {
        el.textContent = msg;
        el.dataset.kind = isError ? 'error' : 'ok';
      }

      async function fetchJson(url, opts = {}) {
        const res = await fetch(url, { cache: 'no-store', ...opts });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || `HTTP ${res.status}`);
        }
        return await res.json();
      }

      function setFormValues(p) {
        els.face_detector.value = p.face_detector;
        els.process_every_n_frames.value = p.process_every_n_frames;
        els.max_faces.value = p.max_faces;
        if (p.draw_color) els.draw_color.value = p.draw_color;
        if (p.draw_thickness) els.draw_thickness.value = p.draw_thickness;

        state.drawColor = els.draw_color.value;
        state.drawThickness = Number(els.draw_thickness.value) || 2;
      }

      function readFormValues() {
        return {
          face_detector: els.face_detector.value,
          process_every_n_frames: Number(els.process_every_n_frames.value),
          max_faces: Number(els.max_faces.value),
          draw_color: els.draw_color.value,
          draw_thickness: Number(els.draw_thickness.value),
        };
      }

      async function refreshStatus() {
        const s = await fetchJson('/api/status');
        els.modelStatus.textContent = s.classifier_loaded ? 'Cargado' : 'No entrenado';
        els.embeddingsStatus.textContent = `${s.embeddings_rows} embeddings / ${s.users.length} usuarios`;
      }

      async function refreshUsers() {
        const users = await fetchJson('/api/users');
        els.usersList.innerHTML = '';
        for (const u of users) {
          const li = document.createElement('li');
          li.innerHTML = `<b>${escapeHtml(u.name)}</b> — ${u.samples} fotos`;
          els.usersList.appendChild(li);
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      async function applyParams(payload) {
        return await fetchJson('/api/params', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      }

      async function captureBlob(quality = 0.82) {
        const v = els.cameraPreview;
        if (!v.videoWidth || !v.videoHeight) return null;

        captureCanvas.width = v.videoWidth;
        captureCanvas.height = v.videoHeight;
        captureCtx.drawImage(v, 0, 0, captureCanvas.width, captureCanvas.height);

        return await new Promise((resolve) => captureCanvas.toBlob(resolve, 'image/jpeg', quality));
      }

      async function sendCurrentFrame() {
        if (!state.cameraStream || state.sendingFrame) return;
        const blob = await captureBlob(0.82);
        if (!blob) return;

        state.sendingFrame = true;
        try {
          const res = await fetch('/api/frame', {
            method: 'POST',
            headers: { 'Content-Type': 'image/jpeg' },
            body: blob,
          });

          if (!res.ok) {
            throw new Error('No se pudo enviar un frame al servidor');
          }

          const data = await res.json();
          state.lastFaces = Array.isArray(data.faces) ? data.faces : [];
          state.lastInferenceMs = Number(data.inference_ms) || 0;

          // FPS real: basado en respuestas del backend
          state.fpsCounter += 1;
          const now = performance.now();
          const dt = now - state.fpsLastTs;
          if (dt >= 1000) {
            state.fpsValue = state.fpsCounter / (dt / 1000);
            state.fpsCounter = 0;
            state.fpsLastTs = now;
          }

          els.inferenceMs.textContent = String(Math.round(state.lastInferenceMs));
          els.facesCount.textContent = String(state.lastFaces.length);
          els.fps.textContent = state.fpsValue.toFixed(1);
        } catch (e) {
          setStatus(els.globalStatus, String(e), true);
        } finally {
          state.sendingFrame = false;
        }
      }

      function drawLoop() {
        state.renderHandle = requestAnimationFrame(drawLoop);
        const v = els.cameraPreview;
        if (!v.videoWidth || !v.videoHeight) return;

        if (els.viewCanvas.width !== v.videoWidth || els.viewCanvas.height !== v.videoHeight) {
          els.viewCanvas.width = v.videoWidth;
          els.viewCanvas.height = v.videoHeight;
        }

        viewCtx.drawImage(v, 0, 0, els.viewCanvas.width, els.viewCanvas.height);

        // Boxes
        viewCtx.lineWidth = Math.max(1, Number(state.drawThickness) || 2);
        viewCtx.strokeStyle = state.drawColor;
        viewCtx.fillStyle = state.drawColor;
        viewCtx.font = '16px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif';
        viewCtx.textBaseline = 'top';

        for (const f of state.lastFaces) {
          const x = Number(f.x) || 0;
          const y = Number(f.y) || 0;
          const w = Number(f.w) || 0;
          const h = Number(f.h) || 0;
          if (w <= 0 || h <= 0) continue;

          viewCtx.strokeRect(x, y, w, h);

          const label = String(f.label ?? 'unknown');
          const conf = Number(f.confidence) || 0;
          const text = `${label} (${conf.toFixed(2)})`;

          const pad = 4;
          const tw = viewCtx.measureText(text).width;
          const th = 18;

          viewCtx.fillRect(x, Math.max(0, y - th), tw + pad * 2, th);
          viewCtx.fillStyle = '#000';
          viewCtx.fillText(text, x + pad, Math.max(0, y - th) + 2);
          viewCtx.fillStyle = state.drawColor;
        }
      }

      async function startCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus(els.globalStatus, 'El navegador no soporta acceso a cámara', true);
          return;
        }

        try {
          state.cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'user',
              width: { ideal: 640 },
              height: { ideal: 480 },
              frameRate: { ideal: 30 },
            },
            audio: false,
          });

          els.cameraPreview.srcObject = state.cameraStream;
          await els.cameraPreview.play();

          if (state.captureTimer) clearInterval(state.captureTimer);
          state.captureTimer = setInterval(() => {
            sendCurrentFrame().catch((e) => setStatus(els.globalStatus, String(e), true));
          }, 33);

          if (!state.renderHandle) {
            drawLoop();
          }

          setStatus(els.globalStatus, 'Cámara activa');
        } catch (e) {
          setStatus(els.globalStatus, String(e), true);
        }
      }

      function stopCamera() {
        if (state.captureTimer) {
          clearInterval(state.captureTimer);
          state.captureTimer = null;
        }
        if (state.renderHandle) {
          cancelAnimationFrame(state.renderHandle);
          state.renderHandle = 0;
        }
        if (state.cameraStream) {
          state.cameraStream.getTracks().forEach((t) => t.stop());
          state.cameraStream = null;
        }
      }

      function updateRegisterStatusLine(extraMsg = '') {
        const n = state.captures.length;
        const msg = `Fotos capturadas: ${n}` + (extraMsg ? `\n${extraMsg}` : '');
        setStatus(els.registerStatus, msg, false);
      }

      async function captureForRegister() {
        const blob = await captureBlob(0.92);
        if (!blob) {
          setStatus(els.registerStatus, 'Cámara no lista para capturar', true);
          return;
        }
        state.captures.push(blob);
        updateRegisterStatusLine();
      }

      async function submitRegister() {
        const name = String(els.registerName.value || '').trim();
        if (!name) {
          setStatus(els.registerStatus, 'Escribe un nombre primero', true);
          return;
        }
        if (state.captures.length === 0) {
          setStatus(els.registerStatus, 'Captura al menos 1 foto', true);
          return;
        }

        els.sendRegisterBtn.disabled = true;
        els.captureBtn.disabled = true;
        els.clearCapturesBtn.disabled = true;

        try {
          setStatus(els.registerStatus, 'Enviando registro...');
          const fd = new FormData();
          fd.append('name', name);
          state.captures.forEach((b, i) => fd.append('images', b, `capture_${i}.jpg`));

          const res = await fetch('/api/register', { method: 'POST', body: fd });
          if (!res.ok) {
            const text = await res.text();
            throw new Error(text || `HTTP ${res.status}`);
          }
          const out = await res.json();

          const rej = Array.isArray(out.rejected) ? out.rejected.length : 0;
          setStatus(
            els.registerStatus,
            `OK: ${out.persisted} nuevas filas (saltadas: ${out.skipped}, rechazadas: ${rej})\nCSV: ${out.embeddings_csv}`,
            false
          );

          state.captures = [];
          await refreshUsers();
          await refreshStatus();
        } catch (e) {
          setStatus(els.registerStatus, String(e), true);
        } finally {
          els.sendRegisterBtn.disabled = false;
          els.captureBtn.disabled = false;
          els.clearCapturesBtn.disabled = false;
        }
      }

      async function trainModel() {
        els.trainBtn.disabled = true;
        try {
          setStatus(els.globalStatus, 'Entrenando...');
          const out = await fetchJson('/api/train', { method: 'POST' });
          setStatus(els.globalStatus, `Entrenado. Clases: ${out.classes.length}`);
          await refreshStatus();
        } catch (e) {
          setStatus(els.globalStatus, String(e), true);
        } finally {
          els.trainBtn.disabled = false;
        }
      }

      async function reloadModel() {
        els.reloadModelBtn.disabled = true;
        try {
          setStatus(els.globalStatus, 'Recargando modelo...');
          await fetchJson('/api/reload-model', { method: 'POST' });
          setStatus(els.globalStatus, 'Modelo recargado');
          await refreshStatus();
        } catch (e) {
          setStatus(els.globalStatus, String(e), true);
        } finally {
          els.reloadModelBtn.disabled = false;
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        els.refreshStatusBtn.addEventListener('click', () => {
          refreshStatus().catch((e) => setStatus(els.globalStatus, String(e), true));
        });
        els.reloadModelBtn.addEventListener('click', () => {
          reloadModel().catch((e) => setStatus(els.globalStatus, String(e), true));
        });

        els.reloadParamsBtn.addEventListener('click', async () => {
          try {
            const p = await fetchJson('/api/params');
            setFormValues(p);
            setStatus(els.paramsStatus, 'Listo');
          } catch (e) {
            setStatus(els.paramsStatus, String(e), true);
          }
        });

        els.paramsForm.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          try {
            setStatus(els.paramsStatus, 'Aplicando...');
            const p = await applyParams(readFormValues());
            setFormValues(p);
            setStatus(els.paramsStatus, 'Aplicado');
          } catch (e) {
            setStatus(els.paramsStatus, String(e), true);
          }
        });

        els.captureBtn.addEventListener('click', () => {
          captureForRegister().catch((e) => setStatus(els.registerStatus, String(e), true));
        });
        els.clearCapturesBtn.addEventListener('click', () => {
          state.captures = [];
          updateRegisterStatusLine('Limpio');
        });
        els.sendRegisterBtn.addEventListener('click', () => {
          submitRegister().catch((e) => setStatus(els.registerStatus, String(e), true));
        });
        els.trainBtn.addEventListener('click', () => {
          trainModel().catch((e) => setStatus(els.globalStatus, String(e), true));
        });
        els.refreshUsersBtn.addEventListener('click', () => {
          refreshUsers().catch((e) => setStatus(els.globalStatus, String(e), true));
        });

        updateRegisterStatusLine();

        try {
          const p = await fetchJson('/api/params');
          setFormValues(p);
          setStatus(els.paramsStatus, 'Listo');
        } catch (e) {
          setStatus(els.paramsStatus, String(e), true);
        }

        try {
          await refreshStatus();
          await refreshUsers();
        } catch (e) {
          setStatus(els.globalStatus, String(e), true);
        }

        startCamera();
      });

      window.addEventListener('beforeunload', stopCamera);
    </script>
  </body>
</html>
