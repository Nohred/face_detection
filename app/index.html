<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Webcam Face Recognition</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
      <header class="header">
      <div>
        <h1>Webcam Face Recognition</h1>
        <p class="sub">Procesamiento y captura en el servidor</p>
      </div>
    </header>

    <main class="layout">
      <section class="video">
        <div class="streamGrid singleStream">
          <article class="streamCard" style="display: none;">
            <div class="streamLabel">Cámara del navegador (Oculta)</div>
            <video id="cameraPreview" autoplay playsinline muted></video>
          </article>
          <article class="streamCard">
            <div class="streamLabel">Vista procesada</div>
            <img id="stream" src="/video" alt="Webcam stream" style="width: 100%; height: auto;" />
          </article>
        </div>
      </section>

      <section class="panel">
        <h2>Parámetros</h2>
        <form id="paramsForm" autocomplete="off">
          <label class="field">
            <span class="label">Detector</span>
            <select id="face_detector" name="face_detector">
              <option value="haar">haar</option>
              <option value="mtcnn">mtcnn</option>
            </select>
          </label>

          <div class="grid2">
            <label class="field">
              <span class="label">Procesar cada N frames</span>
              <input id="process_every_n_frames" name="process_every_n_frames" type="number" min="1" step="1" />
            </label>

            <label class="field">
              <span class="label">Max caras</span>
              <input id="max_faces" name="max_faces" type="number" min="0" step="1" />
            </label>
          </div>

          <fieldset class="fieldset">
            <legend>Apariencia</legend>

            <div class="grid2">
              <label class="field">
                <span class="label">Color</span>
                <input id="draw_color" name="draw_color" type="color" value="#00FF00" />
              </label>

              <label class="field">
                <span class="label">Grosor (1-10)</span>
                <input id="draw_thickness" name="draw_thickness" type="number" min="1" max="10" step="1" value="2" />
              </label>
            </div>
          </fieldset>

          <div class="actions">
            <button type="submit">Aplicar</button>
            <button id="reloadBtn" type="button">Recargar</button>
          </div>

          <p id="status" class="status" role="status"></p>
        </form>

        <!-- <details class="help">
          <summary>Pre-set</summary>
          <div class="helpBody">
            <p><b>MTCNN</b>: Red neuronal muy precisa pero lenta.</p>
            <p><b>Haar</b>: Algoritmo clásico, muy rápido pero menos preciso.</p>
          </div>
        </details> -->
      </section>
    </main>

    <script>
      const els = {
        form: document.getElementById('paramsForm'),
        status: document.getElementById('status'),
        reloadBtn: document.getElementById('reloadBtn'),
        cameraPreview: document.getElementById('cameraPreview'),
        face_detector: document.getElementById('face_detector'),
        process_every_n_frames: document.getElementById('process_every_n_frames'),
        max_faces: document.getElementById('max_faces'),
        draw_color: document.getElementById('draw_color'),
        draw_thickness: document.getElementById('draw_thickness'),
      };

      const captureCanvas = document.createElement('canvas');
      const captureContext = captureCanvas.getContext('2d', { willReadFrequently: false });
      let cameraStream = null;
      let captureTimer = null;
      let sendingFrame = false;

      function setStatus(msg, isError = false) {
        els.status.textContent = msg;
        els.status.dataset.kind = isError ? 'error' : 'ok';
      }

      function updateMtcnnVisibility() {
        // No longer needed
      }

      function setFormValues(p) {
        els.face_detector.value = p.face_detector;
        els.process_every_n_frames.value = p.process_every_n_frames;
        els.max_faces.value = p.max_faces;
        if(p.draw_color) els.draw_color.value = p.draw_color;
        if(p.draw_thickness) els.draw_thickness.value = p.draw_thickness;
      }

      function readFormValues() {
        return {
          face_detector: els.face_detector.value,
          process_every_n_frames: Number(els.process_every_n_frames.value),
          max_faces: Number(els.max_faces.value),
          draw_color: els.draw_color.value,
          draw_thickness: Number(els.draw_thickness.value)
        };
      }

      async function fetchParams() {
        const res = await fetch('/api/params', { cache: 'no-store' });
        if (!res.ok) throw new Error('No se pudo leer /api/params');
        return await res.json();
      }

      async function applyParams(payload) {
        const res = await fetch('/api/params', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || 'Error al aplicar parámetros');
        }
        return await res.json();
      }

      async function sendCurrentFrame() {
        if (!cameraStream || sendingFrame) return;

        const video = els.cameraPreview;
        // Only proceed if video is ready
        if (!video.videoWidth || !video.videoHeight) return;

        sendingFrame = true;
        try {
          captureCanvas.width = video.videoWidth;
          captureCanvas.height = video.videoHeight;
          captureContext.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

          const blob = await new Promise((resolve) => captureCanvas.toBlob(resolve, 'image/jpeg', 0.82));
          if (!blob) return;

          const res = await fetch('/api/frame', {
            method: 'POST',
            headers: { 'Content-Type': 'image/jpeg' },
            body: blob,
          });

          if (!res.ok) {
            throw new Error('No se pudo enviar un frame al servidor');
          }
        } finally {
          sendingFrame = false;
        }
      }

      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus('El navegador no soporta acceso a cámara', true);
          return;
        }

        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'user',
              width: { ideal: 640 },
              height: { ideal: 480 },
              frameRate: { ideal: 30 }
            },
            audio: false,
          });

          els.cameraPreview.srcObject = cameraStream;
          await els.cameraPreview.play();

          if (captureTimer) {
            clearInterval(captureTimer);
          }

          // Send to server periodically (~30 fps)
          captureTimer = setInterval(() => {
            sendCurrentFrame().catch((error) => {
              setStatus(String(error), true);
            });
          }, 33);

          setStatus('Cámara del navegador activa');
        } catch (error) {
          setStatus(String(error), true);
        }
      }

      function stopCamera() {
        if (captureTimer) {
          clearInterval(captureTimer);
          captureTimer = null;
        }

        if (cameraStream) {
          cameraStream.getTracks().forEach((track) => track.stop());
          cameraStream = null;
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        els.reloadBtn.addEventListener('click', async () => {
          try {
            setStatus('Recargando...');
            const p = await fetchParams();
            setFormValues(p);
            setStatus('Listo');
          } catch (e) {
            setStatus(String(e), true);
          }
        });

        els.form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          try {
            setStatus('Aplicando...');
            const payload = readFormValues();
            const p = await applyParams(payload);
            setFormValues(p);
            setStatus('Aplicado');
          } catch (e) {
            setStatus(String(e), true);
          }
        });

        try {
          const p = await fetchParams();
          setFormValues(p);
          setStatus('Listo');
        } catch (e) {
          setStatus(String(e), true);
        }

        startCamera();
      });

      window.addEventListener('beforeunload', stopCamera);
    </script>
  </body>
</html>
