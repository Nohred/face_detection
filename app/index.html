<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Webcam Face Recognition (Local)</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>Webcam Face Recognition</h1>
        <p class="sub">Aplicación local • Stream MJPEG</p>
      </div>
    </header>

    <main class="layout">
      <section class="video">
        <img id="stream" src="/video" alt="Webcam stream" />
      </section>

      <section class="panel">
        <h2>Parámetros</h2>
        <form id="paramsForm" autocomplete="off">
          <label class="field">
            <span class="label">Detector</span>
            <select id="face_detector" name="face_detector">
              <option value="haar">haar</option>
              <option value="mtcnn">mtcnn</option>
            </select>
          </label>

          <div class="grid2">
            <label class="field">
              <span class="label">Procesar cada N frames</span>
              <input id="process_every_n_frames" name="process_every_n_frames" type="number" min="1" step="1" />
            </label>

            <label class="field">
              <span class="label">Max caras</span>
              <input id="max_faces" name="max_faces" type="number" min="0" step="1" />
            </label>
          </div>

          <fieldset id="mtcnnOnly" class="fieldset">
            <legend>Solo MTCNN</legend>

            <div class="grid2">
              <label class="field">
                <span class="label">Detection scale (0.1–1.0)</span>
                <input id="detection_scale" name="detection_scale" type="number" min="0.1" max="1" step="0.05" />
              </label>

              <label class="field">
                <span class="label">Min confidence (0–1)</span>
                <input id="min_face_confidence" name="min_face_confidence" type="number" min="0" max="1" step="0.01" />
              </label>
            </div>
          </fieldset>

          <div class="actions">
            <button type="submit">Aplicar</button>
            <button id="reloadBtn" type="button">Recargar</button>
          </div>

          <p id="status" class="status" role="status"></p>
        </form>

        <details class="help">
          <summary>Pre-set</summary>
          <div class="helpBody">
            <p><b>MTCNN</b>: prueba N=3..5, scale=0.5 y max_faces=1.</p>
            <p><b>Haar</b>: prueba N=2..3 y max_faces=1.</p>
          </div>
        </details>
      </section>
    </main>

    <script>
      const els = {
        form: document.getElementById('paramsForm'),
        status: document.getElementById('status'),
        reloadBtn: document.getElementById('reloadBtn'),
        face_detector: document.getElementById('face_detector'),
        process_every_n_frames: document.getElementById('process_every_n_frames'),
        max_faces: document.getElementById('max_faces'),
        detection_scale: document.getElementById('detection_scale'),
        min_face_confidence: document.getElementById('min_face_confidence'),
        mtcnnOnly: document.getElementById('mtcnnOnly'),
      };

      function setStatus(msg, isError = false) {
        els.status.textContent = msg;
        els.status.dataset.kind = isError ? 'error' : 'ok';
      }

      function updateMtcnnVisibility() {
        const backend = els.face_detector.value;
        els.mtcnnOnly.style.display = backend === 'mtcnn' ? 'block' : 'none';
      }

      function setFormValues(p) {
        els.face_detector.value = p.face_detector;
        els.process_every_n_frames.value = p.process_every_n_frames;
        els.max_faces.value = p.max_faces;
        els.detection_scale.value = p.detection_scale;
        els.min_face_confidence.value = p.min_face_confidence;
        updateMtcnnVisibility();
      }

      function readFormValues() {
        return {
          face_detector: els.face_detector.value,
          process_every_n_frames: Number(els.process_every_n_frames.value),
          max_faces: Number(els.max_faces.value),
          detection_scale: Number(els.detection_scale.value),
          min_face_confidence: Number(els.min_face_confidence.value)
        };
      }

      async function fetchParams() {
        const res = await fetch('/api/params', { cache: 'no-store' });
        if (!res.ok) throw new Error('No se pudo leer /api/params');
        return await res.json();
      }

      async function applyParams(payload) {
        const res = await fetch('/api/params', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || 'Error al aplicar parámetros');
        }
        return await res.json();
      }

      document.addEventListener('DOMContentLoaded', async () => {
        els.face_detector.addEventListener('change', updateMtcnnVisibility);

        els.reloadBtn.addEventListener('click', async () => {
          try {
            setStatus('Recargando...');
            const p = await fetchParams();
            setFormValues(p);
            setStatus('Listo');
          } catch (e) {
            setStatus(String(e), true);
          }
        });

        els.form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          try {
            setStatus('Aplicando...');
            const payload = readFormValues();
            const p = await applyParams(payload);
            setFormValues(p);
            setStatus('Aplicado');
          } catch (e) {
            setStatus(String(e), true);
          }
        });

        try {
          const p = await fetchParams();
          setFormValues(p);
          setStatus('Listo');
        } catch (e) {
          setStatus(String(e), true);
        }
      });
    </script>
  </body>
</html>
